
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lenny_assistant
      POSTGRES_USER: lenny_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_local_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny_app -d lenny_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
